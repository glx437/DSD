<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worker Link Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#0f172a,#1e293b);color:#e2e8f0;min-height:100vh;padding:24px 16px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.main{min-width:0}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#94a3b8;margin-bottom:18px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
label{display:block;font-size:13px;color:#cbd5e1;margin:12px 0 6px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#3b82f6}
textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-primary{background:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-save{background:#059669}
.btn-save:hover{background:#047857}
.btn-save.editing{background:#d97706}
.btn-save.editing:hover{background:#b45309}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.out{margin-top:14px;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:12px;font-family:ui-monospace,Consolas,monospace;word-break:break-all;color:#93c5fd;min-height:38px}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.frame-wrap{position:relative;border:1px solid #334155;border-radius:12px;overflow:hidden;background:#000}
.frame-wrap iframe{display:block;width:100%;height:360px;border:0;background:#000;color-scheme:dark}
.frame-cover{position:absolute;inset:0;background:#000;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;pointer-events:none;transition:opacity .25s}
.frame-cover.hidden{opacity:0}
.frame-cover .tag{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#38bdf8}
.hint{font-size:12px;color:#64748b;margin-top:6px}
.toggle-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#cbd5e1}
.toggle-row input{width:auto;accent-color:#2563eb}
.sidebar{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;height:fit-content;position:sticky;top:24px}
.sidebar h2{font-size:15px;margin-bottom:12px;color:#e2e8f0}
.saved-list{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto}
.saved-item{display:flex;align-items:center;gap:6px;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px 10px;transition:border .2s,background .2s}
.saved-item:hover{border-color:#3b82f6}
.saved-item.active-edit{border-color:#d97706;background:#2a1f0a}
.saved-item.active-run{border-color:#38bdf8;background:#082f49}
.saved-id{font-size:12px;font-weight:700;color:#38bdf8;background:#082f49;padding:2px 8px;border-radius:6px;flex-shrink:0;font-family:ui-monospace,Consolas,monospace}
.saved-item.active-edit .saved-id{color:#fbbf24;background:#3a2a0a}
.saved-item.active-run .saved-id{color:#38bdf8;background:#082f49;box-shadow:0 0 0 2px #38bdf8 inset}
.saved-state{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:5px;flex-shrink:0}
.saved-state.edit{background:#3a2a0a;color:#fbbf24}
.saved-state.run{background:#082f49;color:#38bdf8}
.saved-load{flex:1;background:none;border:0;color:#e2e8f0;font-size:13px;text-align:left;cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-edit{background:#1e40af;border:0;color:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1;flex-shrink:0}
.saved-edit:hover{background:#1d4ed8}
.saved-edit.active{background:#d97706}
.saved-edit.active:hover{background:#b45309}
.saved-del{background:#7f1d1d;border:0;color:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0}
.saved-del:hover{background:#991b1b}
.empty{font-size:13px;color:#64748b;text-align:center;padding:16px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.status-bar{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px 12px;margin-top:14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.status-line{display:flex;gap:8px;align-items:center}
.status-id{color:#38bdf8;font-weight:700;flex-shrink:0}
.status-msg{color:#cbd5e1;flex:1;word-break:break-all}
.status-ok{color:#10b981;font-weight:700;flex-shrink:0}
.status-err{color:#ef4444;font-weight:700;flex-shrink:0}
.mode-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.mode-badge.edit{background:#3a2a0a;color:#fbbf24}
.mode-badge.run{background:#082f49;color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
<div class="main">
<h1>Worker Link Builder</h1>
<div class="sub">Enter parameters generate the link and preview the result in the frame</div>
<div class="card">
<label>URL</label>
<input id="url" placeholder="https://example.com/api">
<div class="row">
<div>
<label>Code</label>
<textarea id="code" placeholder="let res=worker1"></textarea>
</div>
<div>
<label>Post</label>
<textarea id="post" placeholder="{&quot;a&quot;:1}"></textarea>
</div>
</div>
<div class="row">
<div>
<label>Pick</label>
<input id="pick" placeholder="data.items.0.name">
</div>
<div>
<label>Auth</label>
<input id="auth" placeholder="token">
</div>
</div>
<div class="row">
<div>
<label>Method</label>
<select id="method">
<option value="">auto</option>
<option value="GET">GET</option>
<option value="POST">POST</option>
<option value="PUT">PUT</option>
<option value="DELETE">DELETE</option>
</select>
</div>
</div>
<div class="hint">Use worker1 worker2 etc inside any field to inject saved link result before execution</div>
<label class="toggle-row">
<input type="checkbox" id="resolveToggle" checked>
<span>Resolve worker{n} references before execution</span>
</label>
<div class="btn-group">
<button class="btn btn-primary" id="gen">Generate Link</button>
<button class="btn btn-save" id="save">Save</button>
</div>
<div class="out" id="out">Not generated yet</div>
<div class="status-bar" id="statusBar"></div>
</div>
<div class="card">
<div class="preview-head">
<label style="margin:0">Preview</label>
<span id="previewBadge" class="mode-badge" style="display:none"></span>
</div>
<div class="frame-wrap">
<iframe id="frame"></iframe>
<div class="frame-cover" id="frameCover">
<div>No output yet</div>
<div class="tag" id="frameCoverTag"></div>
</div>
</div>
</div>
</div>
<div class="sidebar">
<h2>Saved Links</h2>
<div class="saved-list" id="savedList"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const BASE="https://js.shovidanim.workers.dev/";
const KEY="worker_links_v6";
const $=id=>document.getElementById(id);
const FIELDS=["url","code","post","pick","auth","method"];
let editingId=null;
let runningId=null;
function fields(){
const f={};
for(const k of FIELDS)f[k]=$(k).value;
return f;
}
function setFields(f){
for(const k of FIELDS)$(k).value=f[k]||"";
}
function loadStore(){
try{
return JSON.parse(localStorage.getItem(KEY))||[];
}catch(e){
return[];
}
}
function saveStore(arr){
localStorage.setItem(KEY,JSON.stringify(arr));
}
function nextId(arr){
let max=0;
arr.forEach(x=>{
if(x.id&&x.id.startsWith("w")){
const n=parseInt(x.id.slice(1),10);
if(!isNaN(n)&&n>max)max=n;
}
});
return"w"+(max+1);
}
function buildFrom(f,rawUrl){
const p=[];
const url=(f.url||"").trim();
const code=(f.code||"").trim();
const post=(f.post||"").trim();
const pick=(f.pick||"").trim();
const auth=(f.auth||"").trim();
const method=f.method||"";
if(url)p.push("url="+(rawUrl?url:encodeURIComponent(url)));
if(code)p.push("code="+encodeURIComponent(code));
if(post)p.push("post="+encodeURIComponent(post));
if(pick)p.push("pick="+encodeURIComponent(pick));
if(auth)p.push("auth="+encodeURIComponent(auth));
if(method)p.push("method="+encodeURIComponent(method));
return p.length?BASE+"?"+p.join("&"):"";
}
function status(id,msg,ok){
const bar=$("statusBar");
const line=document.createElement("div");
line.className="status-line";
const idEl=document.createElement("span");
idEl.className="status-id";
idEl.textContent=id;
const msgEl=document.createElement("span");
msgEl.className="status-msg";
msgEl.textContent=msg;
const okEl=document.createElement("span");
okEl.className=ok?"status-ok":"status-err";
okEl.textContent=ok?"OK":"ERR";
line.appendChild(idEl);
line.appendChild(msgEl);
line.appendChild(okEl);
bar.appendChild(line);
bar.scrollTop=bar.scrollHeight;
}
function clearStatus(){
$("statusBar").innerHTML="";
}
function cleanWorkerValue(text){
if(text==null)return"null";
return String(text).replace(/[
]+$/,"").replace(/^s+|s+$/g,"");
}
async function resolveWorkersInValue(val,arr,cache){
if(!/workerd+/.test(val))return val;
const ids=new Set();
const re=/worker(d+)/g;
let m;
while((m=re.exec(val))!==null)ids.add("w"+m[1]);
let out=val;
for(const id of ids){
let text=cache[id];
if(text===undefined){
const item=arr.find(x=>x.id===id);
if(!item){
status(id,"not found in saved links",false);
cache[id]="null";
text="null";
}else{
runningId=id;
render();
status(id,"executing",true);
const link=buildFrom(item,true);
try{
const res=await fetch(link);
text=cleanWorkerValue(await res.text());
cache[id]=text;
status(id,"result: "+text.slice(0,60),true);
}catch(e){
text="null";
cache[id]=text;
status(id,"fetch error: "+e.message,false);
}
}
}else{
status(id,"cached",true);
}
out=out.replace(new RegExp("worker"+id.slice(1),"g"),text);
}
return out;
}
async function resolveAll(f,arr){
const cache={};
const out={};
for(const k of FIELDS){
out[k]=await resolveWorkersInValue(f[k]||"",arr,cache);
}
runningId=null;
render();
return out;
}
function showCover(message,tag){
$("frameCover").querySelector("div").textContent=message||"No output yet";
$("frameCoverTag").textContent=tag||"";
$("frameCover").classList.remove("hidden");
}
function hideCover(){
$("frameCover").classList.add("hidden");
}
function resetPreview(message,tag){
$("frame").removeAttribute("src");
showCover(message,tag);
}
function updateBadge(){
const badge=$("previewBadge");
if(editingId){
badge.style.display="inline-block";
badge.className="mode-badge edit";
badge.textContent="Editing "+editingId;
}else if(runningId){
badge.style.display="inline-block";
badge.className="mode-badge run";
badge.textContent="Running "+runningId;
}else{
badge.style.display="none";
badge.textContent="";
}
}
function setEditing(id){
editingId=id;
const btn=$("save");
if(id){
btn.textContent="Update "+id;
btn.classList.add("editing");
}else{
btn.textContent="Save";
btn.classList.remove("editing");
}
render();
}
function render(){
const list=$("savedList");
const items=loadStore();
list.innerHTML="";
updateBadge();
if(!items.length){
const e=document.createElement("div");
e.className="empty";
e.textContent="No saved links";
list.appendChild(e);
return;
}
items.forEach((item,i)=>{
const row=document.createElement("div");
row.className="saved-item";
if(editingId===item.id)row.classList.add("active-edit");
else if(runningId===item.id)row.classList.add("active-run");
const idEl=document.createElement("span");
idEl.className="saved-id";
idEl.textContent=item.id||"?";
const stateEl=document.createElement("span");
if(editingId===item.id){
stateEl.className="saved-state edit";
stateEl.textContent="EDIT";
}else if(runningId===item.id){
stateEl.className="saved-state run";
stateEl.textContent="RUN";
}
const b=document.createElement("button");
b.className="saved-load";
b.textContent="Load";
b.title="Load "+item.id;
b.addEventListener("click",()=>{
resetPreview("Preview reset for "+item.id,item.id);
$("out").textContent="Not generated yet";
clearStatus();
runningId=null;
setEditing(null);
setFields(item);
render();
});
const ed=document.createElement("button");
ed.className="saved-edit"+(editingId===item.id?" active":"");
ed.textContent=editingId===item.id?"✓":"e";
ed.title="Edit "+item.id;
ed.addEventListener("click",e=>{
e.stopPropagation();
setFields(item);
setEditing(editingId===item.id?null:item.id);
});
const d=document.createElement("button");
d.className="saved-del";
d.textContent="x";
d.title="Delete "+item.id;
d.addEventListener("click",e=>{
e.stopPropagation();
const arr=loadStore();
arr.splice(i,1);
saveStore(arr);
if(editingId===item.id)editingId=null;
if(runningId===item.id)runningId=null;
render();
});
row.appendChild(idEl);
if(stateEl.textContent)row.appendChild(stateEl);
row.appendChild(b);
row.appendChild(ed);
row.appendChild(d);
list.appendChild(row);
});
}
function toast(msg){
const t=$("toast");
t.textContent=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),1500);
}
$("gen").addEventListener("click",async()=>{
clearStatus();
runningId=null;
render();
const f=fields();
const arr=loadStore();
const useResolve=$("resolveToggle").checked;
const resolved=useResolve?await resolveAll(f,arr):{...f};
const link=buildFrom(resolved,true);
$("out").textContent=link||"No parameters provided";
if(link){
showCover("Loading...",runningId||"");
$("frame").src=link;
}else{
resetPreview("No link generated","");
}
});
$("frame").addEventListener("load",()=>{
if($("frame").getAttribute("src"))hideCover();
});
$("frame").addEventListener("error",()=>{
showCover("Failed to load preview","");
});
$("save").addEventListener("click",()=>{
const f=fields();
if(!f.url&&!f.code&&!f.post){
toast("Nothing to save");
return;
}
const arr=loadStore();
if(editingId){
const idx=arr.findIndex(x=>x.id===editingId);
if(idx>=0){
arr[idx]={id:editingId,...f};
saveStore(arr);
toast("Updated "+editingId);
setEditing(null);
return;
}
}
const id=nextId(arr);
arr.push({id,...f});
saveStore(arr);
toast("Saved as "+id);
setEditing(null);
});
render();
resetPreview("No output yet","");
</script>
</body>
</html>
